<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- 液态玻璃主渐变 -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#bae6fd" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#7dd3fc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- 折射高光渐变 -->
    <radialGradient id="refraction" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- 边缘折射光 -->
    <linearGradient id="edgeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>

    <!-- 背景渐变 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0c1929"/>
    </radialGradient>

    <!-- 音符形状遮罩 -->
    <clipPath id="noteClip">
      <path d="M 580 200 C 580 200 580 650 580 650 C 580 700 540 740 500 740 C 460 740 420 700 420 650 C 420 600 460 560 500 560 C 520 560 540 570 560 590 L 560 250 L 720 220 L 720 280 L 580 310 Z"/>
    </clipPath>

    <!-- 玻璃模糊效果 -->
    <filter id="glassBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>

    <!-- 内发光 -->
    <filter id="innerGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset dx="0" dy="0" result="offsetBlur"/>
      <feFlood flood-color="#38bdf8" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feComposite in="SourceGraphic" in2="shadow" operator="over"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bgGrad)"/>

  <!-- 背景装饰光晕 -->
  <circle cx="300" cy="250" r="200" fill="#38bdf8" opacity="0.08"/>
  <circle cx="700" cy="700" r="250" fill="#0ea5e9" opacity="0.06"/>

  <!-- 音符主体 - 液态玻璃效果 -->
  <g filter="url(#innerGlow)">
    <!-- 音符形状（非实心，半透明玻璃） -->
    <path d="M 580 200 C 580 200 580 650 580 650 C 580 700 540 740 500 740 C 460 740 420 700 420 650 C 420 600 460 560 500 560 C 520 560 540 570 560 590 L 560 250 L 720 220 L 720 280 L 580 310 Z"
          fill="url(#glassGrad)"
          stroke="url(#edgeLight)"
          stroke-width="3"/>

    <!-- 玻璃折射效果 -->
    <path d="M 580 200 C 580 200 580 650 580 650 C 580 700 540 740 500 740 C 460 740 420 700 420 650 C 420 600 460 560 500 560 C 520 560 540 570 560 590 L 560 250 L 720 220 L 720 280 L 580 310 Z"
          fill="url(#refraction)"
          opacity="0.6"/>

    <!-- 高光线 - 模拟光线折射 -->
    <path d="M 500 560 C 520 560 540 570 560 590"
          fill="none"
          stroke="white"
          stroke-width="2"
          stroke-linecap="round"
          opacity="0.8"/>

    <path d="M 580 200 L 580 350"
          fill="none"
          stroke="white"
          stroke-width="1.5"
          stroke-linecap="round"
          opacity="0.6"/>

    <!-- 玻璃气泡/光点装饰 -->
    <circle cx="520" cy="650" r="8" fill="white" opacity="0.5"/>
    <circle cx="550" cy="400" r="5" fill="white" opacity="0.4"/>
    <circle cx="650" cy="250" r="6" fill="white" opacity="0.45"/>

    <!-- 音符符头内部折射 -->
    <ellipse cx="500" cy="650" rx="60" ry="45" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- 顶部高光条 - 模拟液态表面张力 -->
  <path d="M 420 580 C 460 550 520 540 560 560"
        fill="none"
        stroke="white"
        stroke-width="1.5"
        stroke-linecap="round"
        opacity="0.4"/>

  <!-- 底部反射 -->
  <path d="M 440 740 C 460 760 500 770 520 760"
        fill="none"
        stroke="white"
        stroke-width="1"
        stroke-linecap="round"
        opacity="0.25"/>
</svg>